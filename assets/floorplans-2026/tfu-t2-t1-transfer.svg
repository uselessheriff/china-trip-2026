<text x="103" y="1052" class="l">Стойка рейса по табло</text><text x="103" y="1080" class="cn">值机 / Check-in</text>
<text x="957" y="1052" class="l">Международный контроль</text><text x="957" y="1080" class="cn">安检 • 海关 • 边防检查</text>
<text x="832" y="1151" class="l">Гейт по посадочному талону / 登机口</text>
<text x="57" y="1232" class="s">Если подтвердят багаж до LED:</text>
<text x="57" y="1273" class="m">Вместо пути выше следуйте «中转 / Transfer» и указаниям сотрудников. Не уходите в общий зал.</text>
<text x="57" y="1313" class="m">Номер стойки и гейта сверяйте на табло. Промежуточный пешеходный переход показан условно.</text>
