<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1510" viewBox="0 0 1500 1510" role="img" aria-labelledby="title desc">
<title id="title">Тяньфу TFU: пересадка T2–T1</title><desc id="desc">Два вида сверху по опубликованным схемам. Багажный зал T2 L2, выходы B1/B2, общий транспортный центр, зал регистрации T1 L4 с островами B, C, D и международным контролем.</desc>
