<text x="118" y="565" class="l">Зал регистрации</text><text x="118" y="597" class="cn">Стойку 3U3816 смотрите на табло</text>
<text x="753" y="863" class="l" text-anchor="middle">Общий вход • Уровень вылета</text>
<text x="58" y="952" class="m">Оранжевая линия показывает направление внутри терминала, не конкретный коридор.</text>
<text x="58" y="995" class="m">Номер выхода сверяйте по табло и посадочному. Места стоек контроля не указаны.</text>
<text x="58" y="1044" class="m">Основа: план 3-го этажа, «Россия», октябрь 2026; зона регистрации, аэропорт Пулково.</text>
