<path class="route" d="M627 667V605H551V574" marker-end="url(#arrow)"/>
<path class="route" d="M551 559H573V516" marker-end="url(#arrow)"/>
<path class="route" d="M573 509V492H317L300 525H188V454" marker-end="url(#arrow)"/>
