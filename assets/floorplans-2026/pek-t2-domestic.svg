<text x="252" y="375" class="muted">Зона посадки</text>
<text x="252" y="400" class="small">внутренних рейсов</text>
<text x="710" y="550" class="small">Международная</text>
<text x="710" y="573" class="small">часть T2</text>
<text x="714" y="660" class="small">Подъезд к этажу 2</text>
<rect x="459" y="536" width="29" height="41" rx="6" fill="#a3b8a3"/><rect x="503" y="536" width="29" height="41" rx="6" fill="#a3b8a3"/><rect x="547" y="536" width="29" height="41" rx="6" fill="#a3b8a3"/><rect x="591" y="536" width="29" height="41" rx="6" fill="#a3b8a3"/>
<text x="349" y="554" class="small">Острова</text>
<text x="349" y="577" class="small">регистрации</text>
