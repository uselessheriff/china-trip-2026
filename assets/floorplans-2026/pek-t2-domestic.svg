<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100" role="img" aria-labelledby="title desc">
<title id="title">Пекин-Столичный PEK: T2, этаж 2. План внутреннего вылета</title>
<desc id="desc">Вид сверху. От входа в зал вылетов к островам регистрации, далее к внутреннему досмотру и в зону посадки. Точный остров и выход проверяются на табло. Север на карте слева.</desc>
<defs>
 <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.8" markerHeight="3.8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a33e15"/></marker>
 <style>
 text{font-family:"DejaVu Sans","Noto Sans CJK SC",sans-serif; fill:#182e37}
 .ink{font-size:22px;font-weight:700}.muted{font-size:19px;fill:#47616b}
 .small{font-size:17px;fill:#47616b}
 .pin circle{fill:#96360f;stroke:#fff;stroke-width:3}.pin text{fill:#fff;font-size:24px;font-weight:700;text-anchor:middle}
 .route{fill:none;stroke:#a33e15;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
 </style>
</defs>
<rect width="1200" height="1100" fill="#f5f3ee"/>
<rect x="29" y="29" width="1142" height="1042" rx="24" fill="#fff" stroke="#d1dcd9" stroke-width="2"/>
<text x="66" y="84" font-size="19" font-weight="700" letter-spacing="2.3" fill="#48676e">PEK / 北京首都国际机场</text>
<text x="66" y="142" font-size="50" font-weight="700">Пекин-Столичный</text>
<text x="66" y="184" font-size="28" fill="#48676e">Терминал 2 · этаж 2 · внутренний вылет</text>
<rect x="66" y="220" width="1068" height="506" rx="15" fill="#f5f8f7" stroke="#dbe4e1"/>
<text x="88" y="257" class="ink">← С</text>
<text x="180" y="257" class="muted">Север слева · вид сверху</text>
