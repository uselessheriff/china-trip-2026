<text x="691" y="446" class="small">Внутренний досмотр</text>
<g class="pin"><g transform="translate(627 628)"><circle r="21"/><text y="8">1</text></g><g transform="translate(551 566)"><circle r="21"/><text y="8">2</text></g><g transform="translate(573 514)"><circle r="21"/><text y="8">3</text></g><g transform="translate(188 454)"><circle r="21"/><text y="8">4</text></g></g>
<g font-size="23" font-weight="700">
<text x="68" y="774">1  Вход 2F / 国内出发</text><text x="602" y="774">2  Регистрация / 值机</text>
<text x="68" y="866">3  Внутренний досмотр / 安全检查</text><text x="602" y="866">4  Внутренняя посадка / 登机口</text>
</g>
<g class="muted">
<text x="68" y="807">Ищи зал внутренних вылетов.</text><text x="602" y="807">Стойку проверь на табло. Уточни багаж.</text>
<text x="68" y="899">Не уходи в международный сектор.</text><text x="602" y="899">Номер гейта проверь на посадочном и табло.</text>
</g>
<path d="M70 947h60" class="route" marker-end="url(#arrow)"/><text x="152" y="954" class="small">Путь между зонами</text><path d="M592 947h60" class="route" stroke-dasharray="4 13"/><text x="670" y="954" class="small">Направления к гейтам, не выбранный гейт</text>
<path d="M68 979H1134" stroke="#d4e0dc"/><text x="68" y="1010" class="small">Схема по историческому плану; не в масштабе. Стойку и гейт сверяй по табло.</text>
<text x="68" y="1037" class="small">Подъезд и другие этажи не показаны. На месте следуй указателям аэропорта.</text>
</svg>
