<path d="M680 512H890V473H1003L1041 442V378H1024V331L1053 298H1090L1119 329V378H1101V637H1120V668L1090 698H1051L1023 669V637H1041V574L1002 541H915L890 565V589H680Z" fill="#e4e9ec" stroke="#7e929d" stroke-width="2.8" stroke-linejoin="round"/>
