<title id="title">Чэнду Тяньфу. Внутренний план международного прилёта, T1–L2</title>
<desc id="description">Упрощённый вид сверху: периметр выходов сходится к пограничному контролю; далее зал выдачи багажа, таможня, выход A1 в зал встречи и в сторону транспортного центра. Точка встречи условна.</desc>
